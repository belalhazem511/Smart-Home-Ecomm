name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SmartHomeEcomm.slnx

      - name: Build
        run: dotnet build SmartHomeEcomm.slnx --configuration Release --no-restore

      # The repository has no test project yet, so this is a no-op today. It is wired up
      # so that adding a test project is the only change needed to get tests running in CI.
      - name: Test
        run: dotnet test SmartHomeEcomm.slnx --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/Presentation/SmartHomeEcomm.API/SmartHomeEcomm.API.csproj --configuration Release --no-build -o out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarthomeecomm-api-publish
          path: out/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: smarthomeecomm-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name smarthomeecomm-smoke \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e JWT_SECRET_KEY=ci-smoke-test-key-at-least-32-characters-long \
            -e DB_CONNECTION_WRITE='Server=127.0.0.1,1433;Database=SmartHomeEcommDb;User Id=sa;Password=Pass123!;Encrypt=False;TrustServerCertificate=True;' \
            -e DB_CONNECTION_READ='Server=127.0.0.1,1433;Database=SmartHomeEcommDb;User Id=sa;Password=Pass123!;Encrypt=False;TrustServerCertificate=True;' \
            -p 8080:8080 \
            smarthomeecomm-api:ci

          # The DB is intentionally unreachable here: /healthz (liveness) must
          # answer 200 anyway, while /readyz (readiness) must report 503 with
          # an Unhealthy body, proving the database gate works end to end.
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz)" = "200" ]; then
              echo "Container is alive"
              break
            fi
            sleep 2
          done

          if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz)" != "200" ]; then
            echo "Container did not become healthy. Logs:"
            docker logs smarthomeecomm-smoke
            docker rm -f smarthomeecomm-smoke
            exit 1
          fi

          if curl -fsS http://localhost:8080/readyz; then
            echo "ERROR: /readyz should be 503 without a database"
            docker logs smarthomeecomm-smoke
            docker rm -f smarthomeecomm-smoke
            exit 1
          fi

          if ! curl -s http://localhost:8080/readyz | grep -q "Unhealthy"; then
            echo "ERROR: /readyz body should report Unhealthy without a database"
            docker logs smarthomeecomm-smoke
            docker rm -f smarthomeecomm-smoke
            exit 1
          fi

          echo "Smoke test passed: alive on /healthz, correctly unready on /readyz"
          docker logs smarthomeecomm-smoke
          docker rm -f smarthomeecomm-smoke
          exit 0
